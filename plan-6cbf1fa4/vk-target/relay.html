<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title>
<p id="s">relay ready</p>
<script>
const ALLOWED = 'https://ads.vk.ru';
window.addEventListener('message', async e => {
  if (e.origin !== ALLOWED || !e.data || !e.data.relayId) return;
  const {relayId, path} = e.data;
  try {
    const r = await fetch(path);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const buf = await r.arrayBuffer();
    e.source.postMessage({relayId, ok: true, buf, type: r.headers.get('content-type')}, e.origin, [buf]);
    document.getElementById('s').textContent = 'sent ' + path;
  } catch (err) {
    e.source.postMessage({relayId, ok: false, err: String(err)}, e.origin);
  }
});
if (window.opener) window.opener.postMessage({relayReady: true}, ALLOWED);
</script>
